name: "Phase 9: 앱 미디어/정적 이미지"
description: Media API, image_assets, 동물/UI 이미지 URL 제공
title: "[FEAT] Phase 9: 앱 미디어/정적 이미지 제공"
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Phase 9는 앱 정적 이미지를 URL 기반으로 제공하는 백엔드 작업입니다.
        이미지 원본과 seed 스크립트는 Git/Docker에 포함하지 않고 운영자가 SSH로 직접 등록합니다.
  - type: textarea
    id: tasks
    attributes:
      label: 작업 항목
      value: |
        - [ ] image_assets migration
        - [ ] Media 조회 API
        - [ ] Character image_urls 연동
        - [ ] 운영 SSH seed 절차 문서화
        - [ ] 테스트/검증
    validations:
      required: true

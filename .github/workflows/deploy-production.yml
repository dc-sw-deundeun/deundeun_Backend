name: Deploy (main -> production)

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

env:
  REGISTRY_HOST: ${{ vars.REGISTRY_HOST || 'docker.io' }}
  REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE || 'deundeun/backend' }}

jobs:
  build-and-push:
    name: Build & Push to Registry (prod)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=prod-sha-${{ steps.sha.outputs.short }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production Target
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # 대상 서버 준비 후 Repository variable ENABLE_PRODUCTION_DEPLOY=true 로 설정
    if: ${{ vars.ENABLE_PRODUCTION_DEPLOY == 'true' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST_PRODUCTION || secrets.GCP_VM_HOST_PROD }}
          port: ${{ secrets.DEPLOY_PORT_PRODUCTION || secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER || secrets.GCP_VM_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY || secrets.GCP_VM_SSH_KEY }}
          script: |
            DEPLOY_DIR="${{ vars.PRODUCTION_DEPLOY_DIR || vars.DEPLOY_DIR || '/opt/deundeun' }}" \
            COMPOSE_FILE="${{ vars.PRODUCTION_COMPOSE_FILE || vars.COMPOSE_FILE || '/opt/deundeun/docker-compose.yml' }}" \
            APP_ENV_FILE="${{ vars.PRODUCTION_APP_ENV_FILE || vars.APP_ENV_FILE || '/opt/deundeun/.env' }}" \
            API_CONTAINER_NAME="${{ vars.PRODUCTION_API_CONTAINER_NAME || vars.API_CONTAINER_NAME || 'deundeun-api' }}" \
            RUN_MIGRATIONS="${{ vars.PRODUCTION_RUN_MIGRATIONS || vars.RUN_MIGRATIONS || 'true' }}" \
            bash "${{ vars.PRODUCTION_DEPLOY_SCRIPT || vars.DEPLOY_SCRIPT || '/opt/deundeun/deploy.sh' }}" "${{ env.REGISTRY_IMAGE }}:prod-sha-${{ needs.build-and-push.outputs.short_sha }}"

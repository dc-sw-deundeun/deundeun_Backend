# deundeun Docker Compose (단일 파일)
#
# 로컬 Postgres만:
#   docker compose -f docker/docker-compose.yml up -d postgres
#
# VM API 배포 (외부 DB — DATABASE_URL은 env_file에 설정):
#   IMAGE_TAG=deundeun/backend:sha-abc1234 ENV_FILE=/opt/deundeun/.env \
#     docker compose -f docker/docker-compose.yml --profile deploy up -d api
#
# 로컬 API + Postgres (이미지 빌드 후):
#   IMAGE_TAG=deundeun/backend:local docker compose -f docker/docker-compose.yml --profile deploy up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: deundeun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deundeun
      POSTGRES_PASSWORD: deundeun
      POSTGRES_DB: deundeun
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deundeun"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    # docker/neo4j 커스텀 이미지: /dumps/neo4j.dump 있으면 최초 1회 자동 로드.
    # 개발/적재: dump 없이 빈 DB로 기동 → kg/scripts/05_load_neo4j.py로 적재.
    # 배포: kg/data/dumps/neo4j.dump 배치 후 기동하면 자동 로드.
    build:
      context: ./neo4j
    image: deundeun/medical-kg-neo4j:local
    container_name: deundeun-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - ../kg/data/dumps:/dumps:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    profiles: ["deploy"]
    image: ${IMAGE_TAG:-deundeun/backend:latest}
    container_name: deundeun-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ${ENV_FILE:-../.env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  neo4j_data:

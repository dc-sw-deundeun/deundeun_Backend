# deundeun Docker Compose
#
# 로컬 Postgres만:
#   docker compose -f docker/docker-compose.yml up -d postgres
#
# 로컬 전체 스택 (API 이미지 빌드 후, postgres + api + nginx):
#   docker compose -f docker/docker-compose.yml --profile deploy up -d
#
# 서버 Postgres만 사전 기동:
#   docker compose --env-file /opt/deundeun/.env -f /opt/deundeun/docker-compose.yml \
#     up -d postgres
#
# 서버 배포 (deploy.sh가 postgres · migrate · api · nginx 순서 처리):
#   bash /opt/deundeun/deploy.sh deundeun/backend:sha-abc1234

name: ${COMPOSE_PROJECT_NAME:-deundeun}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: ${POSTGRES_CONTAINER_NAME:-deundeun-postgres}
    restart: ${POSTGRES_RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deundeun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deundeun}
      POSTGRES_DB: ${POSTGRES_DB:-deundeun}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - deundeun
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-deundeun} -d ${POSTGRES_DB:-deundeun}",
        ]
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL:-5s}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES:-5}
      start_period: ${POSTGRES_HEALTHCHECK_START_PERIOD:-10s}

  neo4j:
    # 외부 의학 KG(#9)가 baked-in된 read-only 이미지. (PKG(#23)는 앱 Postgres로 이전 — 앱은 Neo4j 미접속)
    #   로컬: docker compose -f docker/docker-compose.yml up -d neo4j
    image: ${MEDICAL_KG_IMAGE:-deundeun/medical-kg-neo4j:v1}
    container_name: ${NEO4J_CONTAINER_NAME:-deundeun-neo4j}
    restart: ${NEO4J_RESTART_POLICY:-unless-stopped}
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
      NEO4J_server_bolt_advertised__address: localhost:${NEO4J_BOLT_PORT:-7687}
      NEO4J_server_http_advertised__address: localhost:${NEO4J_HTTP_PORT:-7474}
    ports:
      - "${NEO4J_BIND:-127.0.0.1}:${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_BIND:-127.0.0.1}:${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - neo4jdata:/data
    networks:
      - deundeun
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-change-me} 'RETURN 1' || exit 1",
        ]
      interval: ${NEO4J_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${NEO4J_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${NEO4J_HEALTHCHECK_RETRIES:-10}
      start_period: ${NEO4J_HEALTHCHECK_START_PERIOD:-40s}

  api:
    profiles: ["deploy"]
    image: ${IMAGE_TAG:-deundeun/backend:latest}
    container_name: ${API_CONTAINER_NAME:-deundeun-api}
    restart: ${API_RESTART_POLICY:-unless-stopped}
    env_file:
      - ${APP_ENV_FILE:-../.env}
    expose:
      - "${API_CONTAINER_PORT:-8000}"
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:${API_HOST_PORT:-8000}:${API_CONTAINER_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - deundeun
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${API_CONTAINER_PORT:-8000}/health')\"",
        ]
      interval: ${API_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${API_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${API_HEALTHCHECK_RETRIES:-3}
      start_period: ${API_HEALTHCHECK_START_PERIOD:-10s}

  nginx:
    profiles: ["deploy"]
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: ${NGINX_CONTAINER_NAME:-deundeun-nginx}
    restart: ${NGINX_RESTART_POLICY:-unless-stopped}
    depends_on:
      api:
        condition: service_healthy
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-api.deundeun.xyz}
      NGINX_UPSTREAM_HOST: ${NGINX_UPSTREAM_HOST:-api}
      NGINX_UPSTREAM_PORT: ${NGINX_UPSTREAM_PORT:-8000}
      NGINX_UPSTREAM_KEEPALIVE: ${NGINX_UPSTREAM_KEEPALIVE:-16}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-32m}
      NGINX_PROXY_CONNECT_TIMEOUT: ${NGINX_PROXY_CONNECT_TIMEOUT:-60s}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-120s}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ${NGINX_CONF_DIR:-./nginx}/templates:/etc/nginx/templates:ro
    networks:
      - deundeun
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/run/nginx.pid && kill -0 $(cat /var/run/nginx.pid)"]
      interval: ${NGINX_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${NGINX_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${NGINX_HEALTHCHECK_RETRIES:-3}
      start_period: ${NGINX_HEALTHCHECK_START_PERIOD:-10s}

networks:
  deundeun:
    name: ${COMPOSE_PROJECT_NAME:-deundeun}_net

volumes:
  pgdata:
    name: ${COMPOSE_PROJECT_NAME:-deundeun}_pgdata
  neo4jdata:
    name: ${COMPOSE_PROJECT_NAME:-deundeun}_neo4jdata
